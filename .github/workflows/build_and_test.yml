name: build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27'

    - name: Build
      run: make build

    - name: Test
      run: make test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
    - uses: actions/checkout@v6

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install
      run: npm ci

    - name: Check generated API types are up to date
      run: npm run gen && git diff --exit-code -- src/api/schema.d.ts

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build
