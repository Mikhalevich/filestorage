openapi: 3.1.0
info:
  title: filestorage web API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: |
    HTTP API of the `cmd/web` binary.

    Every route starts with the user that owns the files: `/files/{user}/...`. All file and directory paths are
    relative to that user's directory `<storage.root_dir>/<user>` and must not escape it. The user's directory
    is created on first access.

    Requests need a bearer token whose `sub` claim equals the user (401 without a valid token, 403 for another user).
    The `public` user is the exception: its files are available without a token.

    Errors are written as `text/plain; charset=utf-8` with the error message followed by a newline.
    Unexpected errors are reported as `500 Internal server error` without details.
servers:
  - url: http://localhost:8080

# the token is required for every user except `public`, an empty requirement covers it.
security:
  - bearerAuth: []
  - {}

paths:
  /files/{user}/:
    parameters:
      - $ref: "#/components/parameters/User"
    get:
      operationId: listRootFiles
      summary: List files and subdirectories in the user's root directory
      description: Same as `GET /files/{user}/{path}` for the user's root directory.
      tags: [files]
      responses:
        "200":
          $ref: "#/components/responses/FileList"
        "400":
          $ref: "#/components/responses/InvalidUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: uploadRootFiles
      summary: Upload files into the user's root directory
      description: Same as `POST /files/{user}/{path}` for the user's root directory.
      tags: [files]
      requestBody:
        $ref: "#/components/requestBodies/Upload"
      responses:
        "201":
          $ref: "#/components/responses/StoredFiles"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /files/{user}/{path}:
    parameters:
      - $ref: "#/components/parameters/User"
      - $ref: "#/components/parameters/Path"
    get:
      operationId: listFiles
      summary: List files and subdirectories in a directory
      description: |
        Returns regular files and subdirectories located directly in the directory. Other entries (symlinks, devices…)
        are skipped. Subdirectories come first sorted by name, then files sorted by modification time (oldest first),
        ties are sorted by name.
      tags: [files]
      responses:
        "200":
          $ref: "#/components/responses/FileList"
        "400":
          description: |
            Invalid directory path. Possible messages: `invalid user`, `invalid directory path`, `not a directory`.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
              example: "not a directory\n"
        "404":
          description: "Directory does not exist. Message: `directory not found`."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
              example: "directory not found\n"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: uploadFiles
      summary: Upload files into a directory
      description: |
        Stores every multipart part that has a file name, regardless of its field name.
        Parts without a file name are ignored.

        Files are stored one by one: if one of them fails, previously stored files are kept.
        An existing file is never overwritten: when a name is taken, a numeric suffix is added
        before the extension (`a.txt` -> `a_1.txt`), so stored names may differ from the requested ones.
      tags: [files]
      requestBody:
        $ref: "#/components/requestBodies/Upload"
      responses:
        "201":
          $ref: "#/components/responses/StoredFiles"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: "Directory does not exist. Message: `directory not found`."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
              example: "directory not found\n"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: deleteFile
      summary: Delete a file
      description: Removes the regular file. Directories and other non-regular files are never removed.
      tags: [files]
      responses:
        "204":
          description: File was deleted.
        "400":
          description: |
            Invalid file path. Possible messages: `invalid user`, `invalid file path`, `not a regular file`.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
              example: "not a regular file\n"
        "404":
          description: "File does not exist. Message: `file not found`."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
              example: "file not found\n"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /dirs/{user}/{path}:
    parameters:
      - $ref: "#/components/parameters/User"
      - $ref: "#/components/parameters/Path"
    post:
      operationId: createDirectory
      summary: Create a directory
      description: |
        Creates the last path element only: the parent directory must exist.
        An existing file or directory at the path is never replaced.
      tags: [directories]
      responses:
        "201":
          description: Directory was created.
        "400":
          description: |
            Invalid directory path. Possible messages: `invalid user`, `invalid directory path`, `not a directory`.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
              example: "invalid directory path\n"
        "404":
          description: "Parent directory does not exist. Message: `parent directory not found`."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
              example: "parent directory not found\n"
        "409":
          description: "Path is already taken by a file or directory. Message: `directory already exists`."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
              example: "directory already exists\n"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /download/{user}/{path}:
    parameters:
      - $ref: "#/components/parameters/User"
      - $ref: "#/components/parameters/Path"
    get:
      operationId: downloadFile
      summary: Download a file
      description: |
        Streams the regular file as an attachment. `HEAD` is served as well and returns the same headers without a body.

        Range and conditional requests are supported (handled by Go `http.ServeContent`).
      tags: [files]
      parameters:
        - name: Range
          in: header
          required: false
          description: Byte range to return, e.g. `bytes=0-1023`.
          schema:
            type: string
        - name: If-Range
          in: header
          required: false
          schema:
            type: string
        - name: If-Modified-Since
          in: header
          required: false
          schema:
            type: string
        - name: If-Unmodified-Since
          in: header
          required: false
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: |
            File content. `Content-Type` is detected from the file extension or, if unknown, from the content.
          headers:
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Requested byte range of the file.
          headers:
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
            Content-Range:
              description: Returned range, e.g. `bytes 1-3/5`.
              schema:
                type: string
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            multipart/byteranges:
              schema:
                type: string
                format: binary
        "304":
          description: File was not modified since the time given in the conditional headers.
        "400":
          description: |
            Invalid file path. Possible messages: `invalid user`, `invalid file path`, `not a regular file`.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
              example: "not a regular file\n"
        "404":
          description: "File does not exist. Message: `file not found`."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
              example: "file not found\n"
        "412":
          description: Precondition given in `If-Unmodified-Since` failed.
        "416":
          description: Requested range is not satisfiable.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Ed25519 (EdDSA) signed JWT with `sub`, `exp` and `iss` (when `auth.issuer` is configured) claims.
  parameters:
    User:
      name: user
      in: path
      required: true
      description: |
        User that owns the files, a single path segment. Must equal the token's `sub` claim,
        except for `public` that needs no token. Invalid names (`.`, `..`, containing `\`) that pass
        authorization are rejected with 400.
      schema:
        type: string
      example: public
    Path:
      name: path
      in: path
      required: true
      description: |
        Path relative to the user's directory. May contain `/` separated segments (`sub/dir`).
        Paths escaping the root (`..`) are rejected with 400.
      schema:
        type: string
      example: sub/dir

  requestBodies:
    Upload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              file:
                type: array
                description: Files to store. Any field name works, `file` is used by convention.
                items:
                  type: string
                  format: binary
          encoding:
            file:
              contentType: application/octet-stream

  headers:
    ContentDisposition:
      description: Always `attachment` with the stored file name.
      schema:
        type: string
      example: attachment; filename="a.txt"
    ContentLength:
      schema:
        type: integer
        format: int64
    LastModified:
      description: File modification time.
      schema:
        type: string
      example: Thu, 01 Jan 2026 00:00:00 GMT
    AcceptRanges:
      schema:
        type: string
        const: bytes

  responses:
    FileList:
      description: Subdirectories and files in the directory, empty array if there are none.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/File"
          example:
            - name: sub
              type: directory
              size: 0
              mod_time: "2026-01-01T02:00:00Z"
            - name: a.txt
              type: file
              size: 3
              mod_time: "2026-01-01T00:00:00Z"
            - name: b.txt
              type: file
              size: 5
              mod_time: "2026-01-01T01:00:00Z"
    StoredFiles:
      description: Stored files in the order of the request parts, with their actual names.
      content:
        application/json:
          schema:
            type: array
            minItems: 1
            items:
              $ref: "#/components/schemas/File"
          example:
            - name: a_1.txt
              type: file
              size: 3
              mod_time: "2026-01-01T00:00:00Z"
    BadRequest:
      description: |
        Invalid upload request. Possible messages: `multipart/form-data body expected`, `invalid multipart body`,
        `no files in request`, `invalid user`, `invalid directory path`, `not a directory`, `invalid file name`.
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/Error"
          example: "no files in request\n"
    InvalidUser:
      description: "Invalid user name. Message: `invalid user`."
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/Error"
          example: "invalid user\n"
    Unauthorized:
      description: Missing or invalid bearer token. Never returned for the `public` user.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/Error"
          example: "invalid token\n"
    Forbidden:
      description: "The token's subject is not the user from the path. Message: `forbidden`."
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/Error"
          example: "forbidden\n"
    InternalServerError:
      description: Unexpected server error.
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/Error"
          example: "Internal server error\n"

  schemas:
    File:
      type: object
      description: File or directory entry.
      required: [name, type, size, mod_time]
      properties:
        name:
          type: string
          description: File name without directory.
          example: a.txt
        type:
          type: string
          enum: [file, directory]
          description: Entry type. Uploads always return `file`.
          example: file
        size:
          type: integer
          format: int64
          description: File size in bytes, 0 for directories.
          example: 3
        mod_time:
          type: string
          format: date-time
          description: File modification time (RFC 3339).
          example: "2026-01-01T00:00:00Z"
    Error:
      type: string
      description: Error message followed by a newline.
      example: "file not found\n"

tags:
  - name: files
    description: File storage operations
  - name: directories
    description: Directory operations
