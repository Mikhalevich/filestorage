openapi: 3.1.0
info:
  title: filestorage web API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: |
    HTTP API of the `cmd/web` binary.

    All file and directory paths are relative to the storage root (`storage.root_dir` config field)
    and must not escape it.

    Errors are written as `text/plain; charset=utf-8` with the error message followed by a newline.
    Unexpected errors are reported as `500 Internal server error` without details.
servers:
  - url: http://localhost:8080

# no authentication yet.
security: []

paths:
  /files/:
    get:
      operationId: listRootFiles
      summary: List files in the storage root
      description: Same as `GET /files/{path}` for the storage root directory.
      tags: [files]
      responses:
        "200":
          $ref: "#/components/responses/FileList"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: uploadRootFiles
      summary: Upload files into the storage root
      description: Same as `POST /files/{path}` for the storage root directory.
      tags: [files]
      requestBody:
        $ref: "#/components/requestBodies/Upload"
      responses:
        "201":
          $ref: "#/components/responses/StoredFiles"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /files/{path}:
    parameters:
      - $ref: "#/components/parameters/Path"
    get:
      operationId: listFiles
      summary: List files in a directory
      description: |
        Returns regular files located directly in the directory. Subdirectories and non-regular files are skipped.
        Files are sorted by modification time (oldest first), ties are sorted by name.
      tags: [files]
      responses:
        "200":
          $ref: "#/components/responses/FileList"
        "400":
          description: |
            Invalid directory path. Possible messages: `invalid directory path`, `not a directory`.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
              example: "not a directory\n"
        "404":
          description: "Directory does not exist. Message: `directory not found`."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
              example: "directory not found\n"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: uploadFiles
      summary: Upload files into a directory
      description: |
        Stores every multipart part that has a file name, regardless of its field name.
        Parts without a file name are ignored.

        Files are stored one by one: if one of them fails, previously stored files are kept.
        An existing file is never overwritten: when a name is taken, a numeric suffix is added
        before the extension (`a.txt` -> `a_1.txt`), so stored names may differ from the requested ones.
      tags: [files]
      requestBody:
        $ref: "#/components/requestBodies/Upload"
      responses:
        "201":
          $ref: "#/components/responses/StoredFiles"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: "Directory does not exist. Message: `directory not found`."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
              example: "directory not found\n"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: deleteFile
      summary: Delete a file
      description: Removes the regular file. Directories and other non-regular files are never removed.
      tags: [files]
      responses:
        "204":
          description: File was deleted.
        "400":
          description: |
            Invalid file path. Possible messages: `invalid file path`, `not a regular file`.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
              example: "not a regular file\n"
        "404":
          description: "File does not exist. Message: `file not found`."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
              example: "file not found\n"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /dirs/{path}:
    parameters:
      - $ref: "#/components/parameters/Path"
    post:
      operationId: createDirectory
      summary: Create a directory
      description: |
        Creates the last path element only: the parent directory must exist.
        An existing file or directory at the path is never replaced.
      tags: [directories]
      responses:
        "201":
          description: Directory was created.
        "400":
          description: |
            Invalid directory path. Possible messages: `invalid directory path`, `not a directory`.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
              example: "invalid directory path\n"
        "404":
          description: "Parent directory does not exist. Message: `parent directory not found`."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
              example: "parent directory not found\n"
        "409":
          description: "Path is already taken by a file or directory. Message: `directory already exists`."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
              example: "directory already exists\n"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /download/{path}:
    parameters:
      - $ref: "#/components/parameters/Path"
    get:
      operationId: downloadFile
      summary: Download a file
      description: |
        Streams the regular file as an attachment. `HEAD` is served as well and returns the same headers without a body.

        Range and conditional requests are supported (handled by Go `http.ServeContent`).
      tags: [files]
      parameters:
        - name: Range
          in: header
          required: false
          description: Byte range to return, e.g. `bytes=0-1023`.
          schema:
            type: string
        - name: If-Range
          in: header
          required: false
          schema:
            type: string
        - name: If-Modified-Since
          in: header
          required: false
          schema:
            type: string
        - name: If-Unmodified-Since
          in: header
          required: false
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: |
            File content. `Content-Type` is detected from the file extension or, if unknown, from the content.
          headers:
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Requested byte range of the file.
          headers:
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
            Content-Range:
              description: Returned range, e.g. `bytes 1-3/5`.
              schema:
                type: string
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            multipart/byteranges:
              schema:
                type: string
                format: binary
        "304":
          description: File was not modified since the time given in the conditional headers.
        "400":
          description: |
            Invalid file path. Possible messages: `invalid file path`, `not a regular file`.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
              example: "not a regular file\n"
        "404":
          description: "File does not exist. Message: `file not found`."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
              example: "file not found\n"
        "412":
          description: Precondition given in `If-Unmodified-Since` failed.
        "416":
          description: Requested range is not satisfiable.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    Path:
      name: path
      in: path
      required: true
      description: |
        Path relative to the storage root. May contain `/` separated segments (`sub/dir`).
        Paths escaping the root (`..`) are rejected with 400.
      schema:
        type: string
      example: sub/dir

  requestBodies:
    Upload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              file:
                type: array
                description: Files to store. Any field name works, `file` is used by convention.
                items:
                  type: string
                  format: binary
          encoding:
            file:
              contentType: application/octet-stream

  headers:
    ContentDisposition:
      description: Always `attachment` with the stored file name.
      schema:
        type: string
      example: attachment; filename="a.txt"
    ContentLength:
      schema:
        type: integer
        format: int64
    LastModified:
      description: File modification time.
      schema:
        type: string
      example: Thu, 01 Jan 2026 00:00:00 GMT
    AcceptRanges:
      schema:
        type: string
        const: bytes

  responses:
    FileList:
      description: Files in the directory, empty array if there are none.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/File"
          example:
            - name: a.txt
              size: 3
              mod_time: "2026-01-01T00:00:00Z"
            - name: b.txt
              size: 5
              mod_time: "2026-01-01T01:00:00Z"
    StoredFiles:
      description: Stored files in the order of the request parts, with their actual names.
      content:
        application/json:
          schema:
            type: array
            minItems: 1
            items:
              $ref: "#/components/schemas/File"
          example:
            - name: a_1.txt
              size: 3
              mod_time: "2026-01-01T00:00:00Z"
    BadRequest:
      description: |
        Invalid upload request. Possible messages: `multipart/form-data body expected`, `invalid multipart body`,
        `no files in request`, `invalid directory path`, `not a directory`, `invalid file name`.
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/Error"
          example: "no files in request\n"
    InternalServerError:
      description: Unexpected server error.
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/Error"
          example: "Internal server error\n"

  schemas:
    File:
      type: object
      required: [name, size, mod_time]
      properties:
        name:
          type: string
          description: File name without directory.
          example: a.txt
        size:
          type: integer
          format: int64
          description: File size in bytes.
          example: 3
        mod_time:
          type: string
          format: date-time
          description: File modification time (RFC 3339).
          example: "2026-01-01T00:00:00Z"
    Error:
      type: string
      description: Error message followed by a newline.
      example: "file not found\n"

tags:
  - name: files
    description: File storage operations
  - name: directories
    description: Directory operations
