name: filestorage

services:
  filestorage:
    build:
      context: ../..
      dockerfile: script/docker/Dockerfile.web
    volumes:
      - ./config-web.yaml:/etc/filestorage/config-web.yaml:ro
      - storage:/data/storage
    ports:
      - "8080:8080"
    depends_on:
      jaeger:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build:
      context: ../..
      dockerfile: script/docker/Dockerfile.bot
    environment:
      BOT_TELEGRAM_TOKEN: ${BOT_TELEGRAM_TOKEN:?BOT_TELEGRAM_TOKEN is required}
    volumes:
      - ./config-bot.yaml:/etc/filestorage/config-bot.yaml:ro
      - storage:/data/storage
    depends_on:
      - jaeger
    restart: unless-stopped

  mcp:
    build:
      context: ../..
      dockerfile: script/docker/Dockerfile.mcp
    volumes:
      - ./config-mcp.yaml:/etc/filestorage/config-mcp.yaml:ro
      - storage:/data/storage
    ports:
      - "8081:8081"
    depends_on:
      - jaeger
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: script/docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - filestorage
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: filestorage
      POSTGRES_PASSWORD: filestorage
      POSTGRES_DB: filestorage
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filestorage -d filestorage"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  sql-migrate-user:
    build:
      context: ../../
      dockerfile: script/docker/Dockerfile.sqlmigrate.user
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dbconfig-user.yml:/app/config/dbconfig.yml:ro

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "16686:16686"
    restart: unless-stopped

volumes:
  storage:
  pgdata:
