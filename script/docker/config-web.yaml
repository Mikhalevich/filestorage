log_level: "info"
tracing:
  endpoint: "jaeger:4318"
  service_name: "web"
http_server:
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  shutdown_timeout: 30s
storage:
  root_dir: "/data/storage"
auth:
  # requests must carry "Authorization: Bearer <jwt>" signed with Ed25519 (EdDSA).
  enabled: false
  # PEM encoded PKIX public key, mount it into the container when enabling auth.
  public_key_file: "/etc/filestorage/jwt-public.pem"
  issuer: "filestorage"
