server {
    listen 80;

    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location /files/ {
        proxy_pass http://filestorage:8080;
        client_max_body_size 0;
        proxy_request_buffering off;
    }

    location /download/ {
        proxy_pass http://filestorage:8080;
    }
}
