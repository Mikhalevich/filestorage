log_level: "info"
tracing:
  endpoint: "jaeger:4318"
  service_name: "web"
http_server:
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  shutdown_timeout: 30s
storage:
  root_dir: "./storage"
auth:
  # requests must carry "Authorization: Bearer <jwt>" signed with Ed25519 (EdDSA).
  enabled: false
  # PEM encoded PKIX public key: openssl pkey -in private.pem -pubout -out public.pem
  public_key_file: "./config/jwt-public.pem"
  issuer: "filestorage"
