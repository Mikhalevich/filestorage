log_level: "info"
tracing:
  endpoint: "jaeger:4318"
  service_name: "web"
http_server:
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  shutdown_timeout: 30s
storage:
  root_dir: "./storage"
auth:
  public_key: "some public key"
  private_key: "some private key"
  issuer: "filestorage"
  token_ttl: 1h
postgres:
  connection: "postgres://filestorage:filestorage@localhost:5432/filestorage?sslmode=disable"
